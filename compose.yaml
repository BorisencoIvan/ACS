name: acs

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: acs
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: ${ACS_DB_PASSWORD:-acs_dev_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
